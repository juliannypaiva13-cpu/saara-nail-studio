# Cloudflare PAGES (não é Worker). Este arquivo é a fonte da verdade da configuração do projeto Pages:
# variáveis comuns e a ligação com o banco ficam aqui; segredos ficam SÓ no painel do Cloudflare.
# Nada aqui dá acesso a nada: o database_id é só um identificador, inútil sem login na conta.
#
# Implantação: painel do Cloudflare > Workers & Pages > Create > Pages > Connect to Git
#   Build command: npm run build · Build output directory: dist · Deploy command: (não existe no Pages)
#   NÃO usar "npx wrangler deploy": isso cria um Worker, não um projeto Pages.

name = "saaranailstudio"                 # endereço autorizado: saaranailstudio.pages.dev
pages_build_output_dir = "./dist"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── Produção (ramo main): saaranailstudio.pages.dev ────────────────────────────────────────────────
# VITRINE até os testes e a autorização expressa: o site aprovado fica no ar com o agendamento FECHADO
# (botões levam ao WhatsApp), painel fechado. Sem banco ligado de propósito: a produção não lê nem grava nada.
[vars]
MODO = "vitrine"
ORIGEM = "https://saaranailstudio.pages.dev"
RP_ID = "saaranailstudio.pages.dev"

# ─── Prévia (ramo teste-passkey): teste-passkey.saaranailstudio.pages.dev ──────────────────────────
# HOMOLOGAÇÃO (ambiente de teste): sistema completo — site, agendamento, Pix, painel — só com dados de TESTE.
# No Pages, variáveis e bancos NÃO são herdados: tudo do ambiente de prévia é declarado aqui.
[env.preview.vars]
MODO = "homologacao"
ORIGEM = "https://teste-passkey.saaranailstudio.pages.dev"
RP_ID = "teste-passkey.saaranailstudio.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"                            # nome exigido pelo código (env.DB em src/app.js)
database_name = "saara-nail-studio-db"
database_id = "COLE_AQUI_O_DATABASE_ID"   # copie do painel: Storage & Databases > D1 > saara-nail-studio-db
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "COMPROVANTES"                  # comprovantes de Pix, privados (src/comprovantes.js usa env.COMPROVANTES)
id = "COLE_AQUI_O_ID_DO_KV"               # copie do painel: Storage & Databases > KV > saara-comprovantes
